name: Test
on:
  - push
  - pull_request
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go-version:
          - 1.26.x
          - 1.27.x
        platform:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Get dependencies
        run: go mod download
      - name: Test
        run: go test -v -race ./...
